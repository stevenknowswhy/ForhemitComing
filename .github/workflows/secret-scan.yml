name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (pinned v8.30.1)
        # gitleaks-action is deliberately avoided (it requires an org license).
        # The pinned container scans the full git history; .gitleaks.toml at
        # the repo root extends the default rules and excludes exactly one
        # verified false positive. Any real finding fails the job (exit 1).
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --verbose --redact --no-banner
