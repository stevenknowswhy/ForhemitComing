name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (pinned v8.30.1)
        # gitleaks-action is deliberately avoided (it requires an org license).
        # Scope is the full history of the checked-out ref (HEAD): push events
        # scan main's complete history, PR events scan the PR's complete
        # history on top of main. Legacy branches still carrying pre-rewrite
        # history are deliberately out of scope here (owner follow-up: rewrite
        # or delete them); the moment one is proposed to main, its history is
        # scanned by this job. .gitleaks.toml extends the default rules and
        # excludes exactly one verified false positive. Any real finding fails
        # the job (exit 1).
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="HEAD" --config /repo/.gitleaks.toml --verbose --redact --no-banner
